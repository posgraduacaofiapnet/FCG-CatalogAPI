apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
data:
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: guest
  RabbitMq__PaymentProcessedQueue: catalog-payment-processed
